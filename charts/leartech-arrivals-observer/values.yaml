nameOverride: ""
fullnameOverride: ""

image:
  repository: ""  # set by release.yaml promote-changelog step
  tag: ""         # set by release.yaml promote-changelog step
  pullPolicy: IfNotPresent

replicaCount: 2

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  name: leartech-arrivals-observer
  type: ClusterIP
  port: 8080
  externalPort: 8080

# Ingress annotations + overrides (domain comes from jxRequirements)
ingress:
  annotations: {}
  pathType: ImplementationSpecific
  labels: {}

# jxRequirements — auto-populated from jx-values.yaml per cluster/env.
# Do NOT hardcode domains here.
jxRequirements:
  ingress:
    annotations: {}
    apiVersion: "networking.k8s.io/v1"
    domain: ""
    externalDNS: false
    namespaceSubDomain: -jx.
    serviceType: ""
    tls:
      email: ""
      enabled: false
      production: false
      secretName: ""

knativeDeploy: false

# CRD install — cluster-scoped Arrival CRD. true on the canonical install
# (jx-staging release), false on per-PR preview deploys (the cluster
# already has the CRD installed by the canonical release; previewing a
# second copy errors out on Helm ownership). See templates/crd-arrival.yaml
# for the full ownership-conflict explanation.
crd:
  install: true

# Runtime config that ends up in the ConfigMap + mounted / env-injected.
# Override per env via configs/<env>.yaml or preview helmfile set: block.
config:
  cluster: ""  # "gcp" | "az" — set from .Values.global or env-specific
  logLevel: info
  # LOG_FORMAT toggle — "json" (in-cluster, Loki-queryable) vs any other
  # value (console, dev-local). Every record gets service/version/cluster
  # ambient fields; per-arrival records add event=, arrival=, pack=,
  # phase= so Loki filters work end-to-end. Set to "" in the dev
  # `preview/` helmfile if you want console output on a preview.
  logFormat: json

# Grafana dashboard as a ConfigMap — discovered by the JX Grafana
# sidecar via the `jenkins-x.io/grafana-dashboard: "1"` label. Mirrors
# the automated-agent's proven pattern. Set enabled: false on clusters
# without a Grafana instance or where you want to skip installing.
grafana:
  dashboard:
    enabled: true
    # Grafana folder the dashboard lands in. "Leartech Agents" pairs
    # nicely with the automated-agent dashboards; "Leartech QA" gives
    # a dedicated home when the QA surface grows. Either works.
    folder: "Leartech QA"

# OpenTelemetry traces — emitted via OTLP HTTP to the cluster's Tempo.
# Default endpoint resolves on both GCP and AZ clusters (same service name
# in jx-observability). Set tracing.enabled=false to fully no-op the SDK
# (sets OTEL_TRACES_DISABLED=1 in the container env).
tracing:
  enabled: true
  endpoint: tempo.jx-observability:4318

# Postgres wiring — DB credentials come from ExternalSecret (ESO) referencing
# the cluster's secret backend (GSM on GCP, AKV on Azure).
database:
  # arrivals-observer has no DB — it watches K8s and writes Arrival CRs.
  # Keeping the block so the chart stays template-shaped, but default off.
  enabled: false

  # Name of the database within the shared Postgres cluster. Per golden-std:
  # database-per-service, no cross-DB joins.
  name: leartech_go_service_template
  # Secret name ESO syncs from the cloud backend.
  secretName: leartech-arrivals-observer-db
  # Key inside that secret holding the full DSN.
  secretKey: DATABASE_URL

  # ExternalSecret (ESO) — syncs the DATABASE_URL from the cluster's secret
  # backend. Disable for local/kind or if you provision the secret manually.
  externalSecret:
    enabled: false
    # Name of the SecretStore/ClusterSecretStore to sync from
    storeRef: cluster-secret-store
    storeKind: ClusterSecretStore
    # Remote key in the backend — defaults to {{ fullname }}-database-url
    remoteKey: ""

migrations:
  enabled: false
  image:
    repository: ghcr.io/kukymbr/goose-docker
    tag: "3.22.1"

# go-common auth.Config — populated as env vars with AUTH_ prefix
auth:
  tokenUrl: ""
  clientId: ""
  clientSecret: ""  # from ExternalSecret, not values
  audience: ""

probes:
  liveness: {}
  readiness: {}
  startup: {}

resources: {}  # library defaults apply if empty

podAnnotations: {}

nodeSelector: {}
tolerations: []
affinity: {}

# Per-service dispatch config — the watcher reads this map at ReplicaSet
# events and embeds stagingUrl + testPacks into each Arrival's spec.
# Service name = app.kubernetes.io/name on the ReplicaSet. Services NOT in
# this map produce Arrivals with empty testPacks → controller marks them
# Skipped (recorded but not tested). Override per-cluster from
# `helmfiles/jx-staging/configs/leartech-arrivals-observer.yaml`.
#
# Per-service fields:
#   stagingUrl (string) — base URL health-probed + passed as STAGING_URL
#   testPacks (list)    — packs to dispatch, each {name, type,
#                         resources?, env?}
#   env (list)          — corev1.EnvVar list, service-wide (layered ABOVE
#                         standard env in the runner Job)
#   resources (object)  — corev1.ResourceRequirements, service-wide
#                         override of the global default. Overridden per-pack
#                         by testPacks[].resources.
#
# Per-pack fields (inside testPacks[]):
#   name, type          — as before
#   resources (object)  — optional per-pack Resources override. Precedence
#                         at Job build: pack.resources > service.resources >
#                         DISPATCH_RESOURCES_JSON global default.
#   env (list)          — optional per-pack env vars appended AFTER
#                         service env in the Job (last-wins on name
#                         collisions).
#
# Minimal example:
#   services:
#     leartech-qa-canary:
#       stagingUrl: https://leartech-qa-canary.jx.leartech.com
#       testPacks:
#         - { name: smoke, type: end2end }
#
# Full example — service-wide env + per-pack heavy override:
#   services:
#     leartech-portal:
#       stagingUrl: https://leartech-portal-jx-staging.gcp.leartech.com
#       resources:                     # applied to every pack under this service
#         requests: { cpu: 500m, memory: 1Gi }
#         limits:   { cpu: 2, memory: 4Gi }
#       env:                           # signed-in personas, service-wide
#         - name: USER_EMAIL
#           valueFrom:
#             secretKeyRef:
#               name: auth-service-test-users
#               key: user_email
#               optional: true
#         - name: USER_PASSWORD
#           valueFrom:
#             secretKeyRef:
#               name: auth-service-test-users
#               key: user_password
#               optional: true
#       testPacks:
#         - name: smoke
#           type: end2end               # uses service.resources + service.env
#         - name: end2end-ui
#           type: end2end-ui
#           resources:                  # heavy Playwright + Chromium workers
#             requests: { cpu: 1500m, memory: 3Gi }
#             limits:   { cpu: 3,     memory: 6Gi }
#           env:
#             - { name: PLAYWRIGHT_WORKERS, value: "2" }
#
# Reusable auth-personas services-map snippet — YAML anchors work across
# a single overlay values.yaml (Helm-supported). Prefer this when several
# services all want the same USER_*/PLATFORM_ADMIN_* set:
#
#   _authPersonas: &authPersonas
#     - name: USER_EMAIL
#       valueFrom: { secretKeyRef: { name: auth-service-test-users, key: user_email, optional: true } }
#     - name: USER_PASSWORD
#       valueFrom: { secretKeyRef: { name: auth-service-test-users, key: user_password, optional: true } }
#     - name: PLATFORM_ADMIN_EMAIL
#       valueFrom: { secretKeyRef: { name: auth-service-test-users, key: platform_admin_email, optional: true } }
#     - name: PLATFORM_ADMIN_PASSWORD
#       valueFrom: { secretKeyRef: { name: auth-service-test-users, key: platform_admin_password, optional: true } }
#
#   services:
#     leartech-auth-ui:
#       env: *authPersonas
#     leartech-portal:
#       env: *authPersonas
#
# For template consumers that want the same bundle without YAML anchors,
# the chart also exposes `leartech.authPersonasEnvVars` (see
# templates/_env-personas.tpl).
services: {}

# Test dispatch tunables. timeoutMinutes is wall-clock per Arrival; once
# elapsed, remaining tests get Timeout and the Arrival is finalized.
dispatch:
  timeoutMinutes: 30
  pollIntervalSeconds: 30
  # Container image used by the dispatched K8s Job to run a test pack
  # against the arrival's stagingUrl. Default `playwright-runner` ships
  # Playwright + Chromium + gcloud + python + bash + npm — universal
  # for both end2end (bash run.sh) and end2end-ui (npx playwright test).
  # Override per-cluster via dispatch.runnerImageRegistry (e.g. AZ ACR).
  runnerImageRegistry: us-central1-docker.pkg.dev/product-first/oci
  runnerImageRepository: playwright-runner
  runnerImageTag: "0.28.0"
  # Kubernetes Secret holding the GCS service-account JSON used by the
  # runner to upload results.json to the result-store bucket. Must exist
  # in the watch namespace; same secret as the pre-merge end2end task.
  gcsKeySecret: test-artifacts-gcs-key
  # Result-store bucket — shared by both test-pack results and forensics
  # diff.json uploads.
  resultStoreBucket: test-artifacts-product-first

  # Service-repo discovery for the clone step. Tests live in <repoHost>/
  # <repoOrg>/<service>.git. Per-cluster override only when an org
  # mirrors elsewhere (none today).
  repoHost: github.com
  repoOrg: mikelear

  # Refspec fallback chain — tags JX may have created for the released
  # version. Substituted at Go-side (CLUSTER, VERSION) before passing
  # to the runner script. Order matters: most specific first.
  refFallbacks:
    - "v{{.Version}}-{{.Cluster}}"
    - "v{{.Version}}"
    - "{{.Version}}"
    - "main"

  # Health-probe params for the staging-url readiness check inside the
  # runner. Defaults shipped to mirror prior hardcoded behaviour
  # (10min total / 5s curl / 5s poll / 3 consecutive successes).
  health:
    endpoint: /health/live
    timeoutSeconds: 600
    curlSeconds: 5
    pollSeconds: 5
    successThreshold: 3

  # Per-Job resource requests + limits. Override per cluster when nodes
  # are tight or the runner needs more memory for trace recording.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1500m
      memory: 2Gi

  # GitHub auth secret + key. tekton-bot/password is the JX convention
  # (also used by the qa-gate task and ai-review/feedback tasks).
  gitSecret:
    name: tekton-git
    key: password

# CONTRACT — both writer (this chart's runner script) and reader
# (gate-cli's post-deploy quill) must read these same paths. Keep
# layout in sync with leartech-gate's verdict-comment URL builder.
# Substitution is Go-text/template at the controller; the runner Job
# receives the already-rendered prefix as RESULT_STORE_PATH_PREFIX
# (no shell expansion needed inside the script).
paths:
  postDeployTemplate: "results/v1/post-deploy/{{.Cluster}}/{{.Namespace}}/{{.Service}}/{{.Version}}/{{.Pack}}"
  forensicsTemplate: "forensics/v1/{{.Cluster}}/{{.Namespace}}/{{.Service}}/{{.Version}}"

# Tempo span-diff forensics — auto-triggered when an Arrival reaches
# phase=Failed. The controller fires a fire-and-forget K8s Job using
# leartech-forensics-runner; the runner queries Tempo for two windows
# (deployed_at ± windowMinutes), computes endpoint-level diff, uploads
# to the result store, and patches Arrival.status.forensics.
forensics:
  enabled: true
  # Same registry-split as dispatch.runnerImage* — override registry
  # only per cluster; repo + tag stay default.
  runnerImageRegistry: us-central1-docker.pkg.dev/product-first/oci
  runnerImageRepository: leartech-forensics-runner
  runnerImageTag: "0.0.2"
  tempoBaseUrl: http://tempo.jx-observability:3200
  windowMinutes: 5
  # Span-diff thresholds. latencyRatio = p95(after) / p95(before)
  # ratio above which we flag a regression (1.5 = 50% slower).
  # errorRateDelta = absolute increase in error_rate (0.05 = 5%).
  thresholds:
    latencyRatio: 1.5
    errorRateDelta: 0.05
  # Wall-clock timeout for the runner's Tempo query / diff phase.
  contextTimeoutMinutes: 5

  # Minimum baseline samples per endpoint for a latency regression to
  # be flaggable. Default 3 protects against single-curl noise in
  # high-traffic services. Lower to 1 on low-traffic services (canary
  # smoke that hits each endpoint exactly once) so legitimate huge
  # ratios still get flagged. Plumbed through to the dispatched runner
  # Job as MIN_BASELINE_SAMPLES.
  minBaselineSamples: 3

  # GitHub Issue lifecycle for performance regressions (runner #9).
  # When true the dispatched forensics-runner opens / updates / closes
  # Issues on the service repo when latency or error-rate regressions
  # are detected. Default off — flip per-cluster via the GitOps repo's
  # configs/leartech-arrivals-observer.yaml after smoke-validating on
  # staging. Pairs with #156's env wiring through forensics dispatcher.
  enableIssueCreation: false
  # GitHub org for service-repo Issues. Runner side defaults to
  # "mikelear" when this is unset; override only if forks live elsewhere.
  issueRepoOwner: mikelear


# tekton-git ExternalSecret — synced from cluster secret backend so the
# dispatched test-runner Job can clone PRIVATE service repos. Default
# create:true. On clusters where another chart owns this secret already
# (e.g. leartech-ai-classifier on gsm), set create:false in the per-
# cluster override to avoid conflict.
tektonGit:
  create: true

# Backend toggle for ExternalSecrets — same pattern as ai-classifier /
# auth-service / automated-agent. Per-cluster overlay enables the right
# backend (gcp on gsm, azure on akv).
externalSecrets:
  gcp:
    enabled: false
    # projectId: product-first  # default
    # tektonGitKey: tf-jx-usable-bird-jx-pipeline-user  # default
  azure:
    enabled: false
    # vaultMountPoint: kubernetes  # default
    # vaultRole: jx-vault  # default
    # tektonGitKey: secret/data/jx/pipelineUser  # default
