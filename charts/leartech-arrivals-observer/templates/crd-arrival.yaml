# Arrival CRD — bundled in the consumer chart per the leartech convention
# (Maestro/CNPG/Hydra-Maester pattern; see ~/leartech/hub/shared-rules/
# secrets-and-tekton.md for why). JX3's regen routes this to
# config-root/customresourcedefinitions/jx-staging/leartech-arrivals-observer/
# automatically — applied cluster-wide before any namespaced resource.
#
# CRDs are cluster-scoped, which collides when two Helm releases of the
# same chart try to install them (e.g. the canonical `leartech-arrivals-
# observer` release in jx-staging vs a per-PR `preview` release in a
# preview namespace — Helm refuses to import the existing CRD into the
# new release). Gate the install on .Values.crd.install so preview deploys
# can reuse the cluster's existing CRD without claiming Helm ownership.
#
# Schema decisions:
#   - Namespaced (one Arrival per ReplicaSet event in jx-staging; same
#     service+version in different namespaces = separate Arrivals)
#   - Status subresource enabled (controller updates status without spec
#     write permission)
#   - additionalPrinterColumns for kubectl-readability without -o yaml
#   - x-kubernetes-preserve-unknown-fields on status while v1alpha1 (forgiving)
{{- if .Values.crd.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: arrivals.qa.leartech.com
  labels:
    app.kubernetes.io/part-of: leartech-qa
spec:
  group: qa.leartech.com
  scope: Namespaced
  names:
    kind: Arrival
    listKind: ArrivalList
    plural: arrivals
    singular: arrival
    shortNames: [arr]
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          spec:
            type: object
            required: [service, version, replicaSet, deployedAt]
            properties:
              service:
                type: string
                description: Service name (matches Deployment label app.kubernetes.io/name)
              version:
                type: string
                description: Service version (matches Deployment label app.kubernetes.io/version)
              replicaSet:
                type: string
                description: Name of the ReplicaSet that triggered this arrival
              deployedAt:
                type: string
                format: date-time
              suspectedPR:
                type: integer
                description: GitHub PR number, populated when known
              stagingUrl:
                type: string
                description: Base URL the dispatcher will point tests at (set from chart values.services map; empty = no dispatch)
              testPacks:
                type: array
                description: Test packs to run on this arrival (set from chart values.services[<name>].testPacks)
                # Schema-tolerant on each pack — preserve-unknown-fields lets
                # per-pack resources (corev1.ResourceRequirements) + env
                # (corev1.EnvVar) flow through without parallel CRD maintenance
                # for every new sub-field K8s adds to those shapes (e.g.
                # ResourceClaim, ResizePolicy, or new EnvVarSource variants).
                items:
                  type: object
                  required: [name, type]
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    name: { type: string }
                    type:
                      type: string
                      enum: [end2end, end2end-ui, contract, unit, load]
                    resources:
                      type: object
                      description: "Optional per-pack resource requests/limits (corev1.ResourceRequirements). Overrides service.resources + global default. Precedence: pack > service > global."
                      x-kubernetes-preserve-unknown-fields: true
                    env:
                      type: array
                      description: "Optional per-pack env vars appended on top of service.env in the dispatched Job. corev1.EnvVar shape (literal or secretKeyRef)."
                      x-kubernetes-preserve-unknown-fields: true
                      items:
                        type: object
                        required: [name]
                        properties:
                          name: { type: string }
              env:
                type: array
                description: "Per-service env vars injected into the dispatched test Job (corev1.EnvVar shape). Set from chart values.services[<name>].env. Used to thread per-cluster config (HYDRA_ADMIN_URL, USER_EMAIL/PASSWORD from k8s Secret) into test specs without rebuilding the runner image."
                # Schema-tolerant — preserve-unknown-fields lets chart values use any
                # corev1.EnvVar field (including future additions like fieldRef,
                # configMapKeyRef) without parallel CRD maintenance.
                x-kubernetes-preserve-unknown-fields: true
                items:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string }
              resources:
                type: object
                description: "Optional per-service resource requests/limits (corev1.ResourceRequirements) applied to every pack dispatched under this service. Overridden by pack.resources when a pack sets its own."
                x-kubernetes-preserve-unknown-fields: true
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
            properties:
              phase:
                type: string
                enum: [Pending, Testing, Passed, Failed, Timeout, Skipped]
                default: Pending
              tests:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    type:
                      type: string
                      enum: [end2end, end2end-ui, contract, unit, load]
                    status:
                      type: string
                      enum: [Pending, Running, Passed, Failed, Timeout]
                    startedAt: { type: string, format: date-time }
                    completedAt: { type: string, format: date-time }
                    retryCount: { type: integer, default: 0 }
                    jobName: { type: string }
              finalizedAt:
                type: string
                format: date-time
              newlyFailed:
                type: array
                items: { type: string }
              # Tempo span-diff forensics. Populated by leartech-forensics-
              # runner Job, dispatched by the controller when an Arrival
              # reaches phase=Failed. Best-effort — the field stays empty
              # if forensics is disabled or the runner couldn't reach Tempo.
              forensics:
                type: object
                properties:
                  diffUrl: { type: string, description: "gs:// URL of the full diff.json" }
                  generatedAt: { type: string, format: date-time }
                  jobName: { type: string }
                  summary:
                    type: object
                    properties:
                      missing: { type: integer, description: "Endpoints in before-window absent in after-window" }
                      new: { type: integer, description: "Endpoints in after-window absent in before-window" }
                      latency_regressions: { type: integer, description: "Endpoints with p95_after/p95_before > threshold" }
                      error_rate_regressions: { type: integer, description: "Endpoints with err_rate_delta > threshold" }
    additionalPrinterColumns:
    - name: Service
      type: string
      jsonPath: .spec.service
    - name: Version
      type: string
      jsonPath: .spec.version
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: ReplicaSet
      type: string
      priority: 1
      jsonPath: .spec.replicaSet
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp

{{- end }}
