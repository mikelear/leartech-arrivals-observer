{{- /*
Syncs tekton-git credentials into the watch namespace. The dispatched
test-runner Job mounts this secret as GIT_TOKEN env so it can clone
PRIVATE service repos (most of mikelear/leartech-* are private).

Multi-cluster pattern (mirrors leartech-ai-classifier's template):
  - .Values.externalSecrets.gcp.enabled      → gcpSecretsManager backend
  - .Values.externalSecrets.azure.enabled    → Vault backend
Per-cluster GitOps overlay flips the right one.

Single-owner-per-cluster: if another chart in the same namespace
already deploys a `tekton-git` ExternalSecret (e.g. leartech-ai-classifier
on gsm), set `tektonGit.create: false` in this chart's values to opt out
and reference the existing secret by name.
*/}}
{{- if and .Values.tektonGit.create (or .Values.externalSecrets.gcp.enabled .Values.externalSecrets.azure.enabled) }}
{{- if .Values.externalSecrets.gcp.enabled }}
apiVersion: kubernetes-client.io/v1
kind: ExternalSecret
metadata:
  name: tekton-git
spec:
  backendType: gcpSecretsManager
  projectId: {{ .Values.externalSecrets.gcp.projectId | default "product-first" }}
  data:
  - name: password
    key: {{ .Values.externalSecrets.gcp.tektonGitKey | default "tf-jx-usable-bird-jx-pipeline-user" }}
    property: token
    version: latest
  - name: username
    key: {{ .Values.externalSecrets.gcp.tektonGitKey | default "tf-jx-usable-bird-jx-pipeline-user" }}
    property: username
    version: latest
  template:
    metadata:
      annotations:
        tekton.dev/git-0: "https://github.com"
    type: kubernetes.io/basic-auth
{{- end }}
{{- if .Values.externalSecrets.azure.enabled }}
apiVersion: kubernetes-client.io/v1
kind: ExternalSecret
metadata:
  name: tekton-git
spec:
  backendType: vault
  vaultMountPoint: {{ .Values.externalSecrets.azure.vaultMountPoint | default "kubernetes" }}
  vaultRole: {{ .Values.externalSecrets.azure.vaultRole | default "jx-vault" }}
  data:
  # Vault property name is `token` (not `password`) — matches the
  # existing tekton-git ExternalSecret in the jx namespace, which is
  # the JX-managed source of truth for pipeline credentials.
  - name: password
    key: {{ .Values.externalSecrets.azure.tektonGitKey | default "secret/data/jx/pipelineUser" }}
    property: token
  - name: username
    key: {{ .Values.externalSecrets.azure.tektonGitKey | default "secret/data/jx/pipelineUser" }}
    property: username
  template:
    metadata:
      annotations:
        tekton.dev/git-0: "https://github.com"
    type: kubernetes.io/basic-auth
{{- end }}
{{- end }}
