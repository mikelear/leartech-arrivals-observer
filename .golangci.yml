# Per-repo overrides only (v2 format). Canonical linter config lives at
# leartech-pipeline-catalog/go/.golangci.base.yml and is merged in by
# both CI (tasks/go-lint/pullrequest.yaml) and `make lint-config` locally.
version: "2"

run:
  # k8s.io/client-go is a deep dependency tree; with kubernetes/fake +
  # dynamic/fake imported in the test packages, buildir + nilness analysis
  # exceeds the catalog's 5m default. Local bump until we move expensive
  # linters off test files (or upstream the bump).
  timeout: 20m

formatters:
  settings:
    goimports:
      local-prefixes:
        - github.com/mikelear/leartech-arrivals-observer
