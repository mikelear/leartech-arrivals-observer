apiVersion: config.lighthouse.jenkins-x.io/v1alpha1
kind: TriggerConfig
spec:
  presubmits:
  - name: pr
    context: "pr"
    always_run: true
    source: pullrequest.yaml
  - name: lint
    context: "lint"
    always_run: true
    source: lint.yaml
  - name: test
    context: "test"
    always_run: true
    source: test.yaml
  - name: govulncheck
    context: "govulncheck"
    always_run: true
    source: govulncheck.yaml
  - name: security-scan
    context: "security-scan"
    always_run: true
    source: security-scan/pullrequest.yaml
  - name: image-scan
    context: "image-scan"
    always_run: true
    source: security-scan/image-scan.yaml
  # No dynamic-scan: arrivals-observer is an in-cluster controller with
  # no public HTTP surface (only kubelet /health probes), so nuclei/
  # nikto-style scanners have nothing to point at. Mirrors forensics-
  # runner's triggers and the same rationale as the inlined no-preview
  # pullrequest.yaml above (#109).
  - name: ai-review
    context: "ai-review"
    always_run: true
    source: ai-review/pullrequest.yaml
  - name: ai-feedback
    context: ai-feedback
    always_run: false
    optional: true
    trigger: "(?m)^/ai-feedback"
    rerun_command: "/ai-feedback"
    source: ai-review/feedback.yaml
  postsubmits:
  - name: release
    context: release
    source: release.yaml
    branches:
    - ^main$
