apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: test
spec:
  pipelineSpec:
    tasks:
    - name: go-test
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          image: uses:mikelear/leartech-pipeline-catalog/tasks/go-test/pullrequest.yaml@main
          name: ""
          resources: {}
          workingDir: /workspace/source
          # 12% per-repo floor (below catalog's 60% golden-std). Most of
          # this codebase is K8s glue (watcher.go, controller.go ≈900 LOC)
          # which needs fake-clientset infrastructure to unit-test cleanly.
          # Pure helpers (dispatch path/ref rendering, config loading,
          # forensics aggregate/compare) are covered. TODO: backfill
          # watcher + controller tests with k8s.io/client-go/kubernetes/
          # fake, then raise the threshold in steps toward 60%.
          env:
          - name: COVERAGE_THRESHOLD
            value: "12.0"
        steps:
        - name: ""
          resources: {}
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 1h0m0s
status: {}
