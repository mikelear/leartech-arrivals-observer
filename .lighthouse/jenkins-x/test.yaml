apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: test
spec:
  pipelineSpec:
    tasks:
    - name: go-test
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          image: uses:mikelear/leartech-pipeline-catalog/tasks/go-test/pullrequest.yaml@main
          name: ""
          resources: {}
          workingDir: /workspace/source
          # 70% ratcheted floor — matches the Makefile's test-coverage
          # target. Raised from the historical 12% once the envtest
          # harness + state-machine conformance + chart-render tests
          # landed (2026-08 test-harness-parity initiative). ONE-WAY
          # RATCHET: never lower without an accompanying deliberate
          # coverage strategy change; the safety property is that a
          # code change dropping coverage should FAIL the gate rather
          # than silently regress. Keep in sync with Makefile.
          env:
          - name: COVERAGE_THRESHOLD
            value: "70.0"
        steps:
        - name: ""
          resources: {}
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 1h0m0s
status: {}
